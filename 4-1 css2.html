<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h2,h3,p{
            padding: 0;
            margin: 0;
        }
        #box{
            width: 480px;
            padding: 8px;
            border:1px  solid #ccc;
            font-size:12px;
            margin: 20px;
        }
        #box h3{
            font-size: 16px;
            /* 居中 */
            text-align: center;
            /* 行高 33px*/
            line-height: 33px;
            /* 字间距3px */
            letter-spacing: 3px;
            color: #036;
        }
        #box p{
            /* 行高150% */
            line-height: 150%;
            color: #666;
            /*首行缩进2em*/
            text-indent: 2em;
        }
        #box a{
            color: #f11;
            text-decoration: none;
            /*加粗*/
            font-weight: bold;
        }
        .snum{
            color: rgb(78, 133, 188);
            font-weight: bold;
        }
        .yname{
            color: rgb(8, 26, 45);
            font-weight: bold;
        }
        .class{
            color: #080;
            font-weight: bold;
        }
        .level{
            color: #f11;
            font-weight: bold;
        }
        .knowledge{
            display: inline-block;
            padding: 2px 8px;
            border: 1px solid #9c4dcc;
            background-color: #f5ebff;
            color: #7a3ab3;
            font-weight: bold;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <h2>css进阶</h2>
    <div id="box">
        <h3>CSS那些事</h3>
        <p>
            /*学号蓝色加粗，姓名深色加粗，班级绿色加粗，难字红色加粗，知识点紫色边框，边框为额外内容，使用内部CSS*/

            学号：<span class='snum'>426</span>，姓名：<span class='yname'>梁月虹</span>，班级：<span class='class'>计算机24004</span>，对于《高级网页设计》课程的难度认知为：<span class='level'>难</span>，
            这个例子对应的知识点是：<span class="knowledge">群组选择器、后代选择器、层叠与继承</span>。
            <a href="'#">更多>></a>
        </p>
    </div>
</body>
</html>
