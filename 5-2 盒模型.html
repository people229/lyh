<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒模型、框模型，box model</title>
    <style>
        body,h2,ul,li{
            margin:0;
            padding:0;
        }
        #a{
            width: 400px;
            height: 400px;
            border: 1px solid #039;
            margin: 40px auto;
            padding:50px 40px 30px 20px;/* 上 右 下 左 */
        }
        #b{
            width: 400px;
            height: 400px;
            border: 1px dashed #039;
            margin: 50px auto 40px;
            border-left: 1px dotted #f00;
        }
        /*扩展：完成c和d，边框用dotted，宽度为3px */
        #c{
            width: 400px;
            height: 400px;
            border: 3px dotted #039;
            margin: 50px auto 40px;
        }
        #d{
            width: 400px;
            height: 400px;
            border: 3px dotted #f00;
            margin: 50px auto 40px;
        }
        /*扩展： 修改网页*/
    </style>
        
</head>
<body>
    <div id="a">426梁月虹</div>
    <div id="b">426梁月虹</div>
    <div id="c">426梁月虹</div>
    <div id="d">426梁月虹</div>
</body>
</html>
