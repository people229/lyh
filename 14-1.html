<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>梁月虹的JavaScript</h2>
    <script>
        document.write("<h3>hello world</h3>");
        alert("hello world");
        console.log("hello world,liangyuehong");
        //prompt和confirm
        var name = prompt("请输入您的姓名");
        alert("您的姓名是：" + name);
        var age = confirm("您是否已满18岁？");
        if(age){
            alert("您已满18岁");
        }else{
            alert("您未满18岁");
        }
    </script>
</body>
</html>
