<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>426梁月虹</title>
    <style>
        p {
            color: #94a;
            font-size: 50px;
        }

        #box {
            width: 600px;
            height: 500px;
            background-color: #ccc;
        }

        h2 {
            color: white;
            background-color: black;
        }

        .n1, .n2, .n3 {
            font-size: 100px;
        }

        .n1 { color: red; }
        .n2 { color: green; }
        .n3 { color: blue; }

        .selector {
            color: white;
        }

        .new-box {
            width: 300px;
            height: 300px;
            background-color: pink;
        }
    </style>
</head>
<body>
    <h2>层叠样式表 CSS</h2>

    <div id="box">
        <p>CSS<span class="selector">选择器</span></p>
        <p><span class="n1">梁</span><span class="n2">月</span><span class="n3">虹</span></p>
        <p>CSS属性</p>
    </div>

    <div class="new-box"></div>
</body>
</html>
