<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #ededed;
        }

        .flex {
            display: flex;
            flex-wrap: nowrap;
            list-style: none;
            margin: 0;
            padding: 0;
            width: 100%;
        }

        .flex li {
            width: 25%;
            height: 340px;
            border: 1px solid #3a3a3a;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .box {
            width: 90px;
            height: 90px;
            background: #d8d8d8;
            border: 2px solid #2f2f2f;
        }

        .flex li:nth-child(1) .box {
            width: 140px;
            height: 140px;
        }

        .flex li:nth-child(2) {
            justify-content: center;
            align-items: center;
        }

        .group-2,
        .group-4 {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
        }

        .group-2 {
            height: 100%;
        }

        .group-2 .box.top,
        .group-2 .box.bottom,
        .group-4 .box.top {
            width: 180px;
            height: 76px;
        }

        .row {
            display: flex;
            gap: 18px;
        }

        .grid-3 {
            display: flex;
            flex-wrap: wrap;
            width: 210px;
            justify-content: space-between;
            align-content: space-between;
            gap: 18px;
        }

        .grid-3 .box {
            width: 94px;
            height: 94px;
        }

        .group-4 .box.top {
            width: 220px;
            height: 72px;
        }

        .group-4 .row .box {
            width: 100px;
            height: 100px;
        }
    </style>
</head>
<body>
    <ul class="flex">
        <li>
            <div class="box"></div>
        </li>
        <li>
            <div class="group-2">
                <div class="box top"></div>
                <div class="box bottom"></div>
            </div>
        </li>
        <li>
            <div class="grid-3">
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
            </div>
        </li>
        <li>
            <div class="group-4">
                <div class="box top"></div>
                <div class="row">
                    <div class="box"></div>
                    <div class="box"></div>
                </div>
            </div>
        </li>
    </ul>
</body>
</html>
