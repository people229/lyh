<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            background-color: #f2f3f4;
            display: flex;
            flex-wrap: wrap;
            margin: 0 auto;
        }
        .box{
            width: 150px;
            height: 159px;
            border: 1px solid #ccc;
            background-color: white;
            margin: 10px;
            font-size: 14px;
            display: flex;
            /*水平垂直居中*/
            justify-content: center;
            align-items: center;
            transition: all 0.6s;
            box-sizing: border-box;
            /*width包括了padding和border*/
        }
        .box:first-child:hover{
            background-color: #000;
            color: #fff;
            font-size: 100px;
            border-width: 30px;
        }
        .box:nth-child(2):hover{
            box-shadow: 10px 10px 20px rgba(0, 0, 0, 0.5);
        }
        .box:nth-child(3):hover{
            text-shadow: 100px 0px 20px rgba(0, 0, 0, 0.5);
        }
        .box:nth-of-type(4):hover{
            border-radius: 50%;
        }
        .box:nth-of-type(5){
            /*线性渐变*/
            background: linear-gradient(#000,#fff);
        }
        .box:nth-of-type(6):hover{
            background: radial-gradient(#fff,#000);
        }
        .box:nth-of-type(6)+.box:hover{
            transform: scale(0.5);
        }
        .box:nth-of-type(8):hover{
            transform: translateX(-100px);
        }
        .box:nth-of-type(9):hover{
            transform: rotateZ(-180deg);
        }
        .box:nth-of-type(10):hover{
            transform: skewX(-45deg);
        }
        .box:nth-last-child(2):hover::before{
            content: "1";
            color: red;
        }
        /*最后一个*/
        .box:last-child:hover::after{
            content: "梁月虹";
            color: #fff;
            font-size: 14px;
            line-height: 40px;
            text-align: center;
            display: block;
            width: 80px;
            height: 40px;
            margin: 10px;
            background-color: #000;
            border-radius: 20px;
            position: absolute;
            right: 8px;
            bottom: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            /*扩展：黑底白字居中圆角你的名字，有距离*/
        }
        .box:nth-of-type(3n):hover{
            border: 3px solid #f00;
        }
        /*扩展：鼠标在偶数个盒子上有变化，变化效果自定义*/
        .box:nth-of-type(2n):hover{
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
        <div class="box">10</div>
        <div class="box">11</div>
        <div class="box">12</div>

    </div>
</body>
</html>
