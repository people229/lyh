<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>426梁月虹</title>
    <style>
        p{
            color:#94a;
            font-size: 50px;
        }
        /*标签选择器*/
        #box{
            width: 600px;
            height: 500px;
            background-color: #ccc;
        }
        h2 {
            color: white;
            background-color: black;
        }
/* id选择器 */
        .n1{
            color: #ff0000;
            font-size: 100px;
        }
        .n2{
            color: #00ff00;
            font-size: 100px;
        }
        .n3{
            color: #0000ff;
            font-size: 100px;
        }
                .selector {
            color: white;
        }

        .new-box {
            width: 300px;
            height: 300px;
            background-color: pink;
        }
    </style>
</head>
<body>
    <h2>层叠样式表 CSS</h2>
    <div id ="box"> 
        <p>CSS<span class="selector">选择器</span></p>
        <p><span class="n1">梁</span><span class="n2">月</span><span class="n3">虹</span></p>
        <p>CSS属性</p>        
    </div>
    <!--扩展1：名字的每个字不同颜色，在同一行显示-->
    <!--扩展2：h2黑底白字-->
    <!--扩展3：选择器三个字是白色    或   新增一个宽300高300的盒子，有背景颜色-->
    <div class="new-box"></div>
</body>
</html>
