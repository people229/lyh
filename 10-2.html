<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>梁月虹 - 图片轮播</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #f2f3ef;
            font-family: "Microsoft YaHei", sans-serif;
        }

        .slideshow {
            position: relative;
            width: min(100%, 540px);
            aspect-ratio: 4 / 3;
        }

        .slide {
            position: absolute;
            inset: 0;
            display: grid;
            grid-template-rows: 1fr 52px;
            overflow: hidden;
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 16px 36px rgba(30, 40, 32, 0.16);
            opacity: 0;
            animation: slide-show 12s ease-in-out infinite both;
        }

        .slide:nth-child(2) {
            animation-delay: 4s;
        }

        .slide:nth-child(3) {
            animation-delay: 8s;
        }

        .slide img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .slide p {
            display: grid;
            place-items: center;
            margin: 0;
            color: #20352a;
            font-size: 18px;
            font-weight: 600;
        }

        @keyframes slide-show {
            0% { opacity: 0; }
            5% { opacity: 1; }
            25% { opacity: 1; }
            33.333% { opacity: 0; }
            100% { opacity: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            .slide {
                animation: none;
            }

            .slide:first-child {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <main class="slideshow" aria-label="梁月虹图片幻灯片">
        <article class="slide">
            <img src="img/1 .jpg" alt="梁月虹图片一">
            <p>梁月虹</p>
        </article>
        <article class="slide">
            <img src="img/2 .jpg" alt="梁月虹图片二">
            <p>梁月虹</p>
        </article>
        <article class="slide">
            <img src="img/4.jpg" alt="梁月虹图片三">
            <p>梁月虹</p>
        </article>
    </main>
</body>
</html>
